
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.db{padding:1.5rem;background:var(--color-background-tertiary);min-height:600px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:#1D9E75;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:16px;height:16px;fill:white}
.app-title{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.view-toggle{display:flex;gap:4px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:3px}
.vbtn{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:500;border:none;cursor:pointer;transition:all 0.15s;background:transparent;color:var(--color-text-secondary)}
.vbtn.active{background:var(--color-background-primary);color:#1D9E75;border:0.5px solid var(--color-border-secondary)}
.greeting{font-size:13px;color:var(--color-text-secondary)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:1.5rem}
.kpi{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem}
.kpi-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi-dot{width:7px;height:7px;border-radius:50%}
.kpi-val{font-size:24px;font-weight:500;color:var(--color-text-primary);line-height:1}
.kpi-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:4px}
.mid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;margin-bottom:1.5rem}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem}
.card-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:1rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}
.leg-sq{width:9px;height:9px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:6px 8px;font-size:11px;font-weight:500;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);letter-spacing:0.03em}
tbody tr{border-bottom:0.5px solid var(--color-border-tertiary)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:9px 8px;color:var(--color-text-primary);vertical-align:middle}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-open{background:#E1F5EE;color:#0F6E56}
.b-prog{background:#E6F1FB;color:#185FA5}
.b-closed{background:#F1EFE8;color:#5F5E5A}
.b-urgent{background:#FCEBEB;color:#A32D2D}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.prio-dot{width:6px;height:6px;border-radius:50%}
.agent-av{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:1.5rem}
.donut-labels{display:flex;flex-direction:column;gap:8px}
.dl-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary)}
.dl-val{font-weight:500;color:var(--color-text-primary);margin-left:auto;padding-left:8px}
</style>

<div class="db">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-9 11H7v-2h4v2zm6 0h-4v-2h4v2zm0-4H7V7h10v2z"/></svg></div>
      <span class="app-title">Tickets — atención al cliente</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="view-toggle">
        <button class="vbtn active" onclick="setView('admin',this)">Administrador</button>
        <button class="vbtn" onclick="setView('agente',this)">Agente</button>
      </div>
      <span class="greeting" id="greeting-name">Bienvenido, Admin</span>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="mid">
    <div class="card">
      <div class="card-title">Tickets por semana</div>
      <div class="legend">
        <div class="leg-item"><div class="leg-sq" style="background:#1D9E75"></div>Abiertos</div>
        <div class="leg-item"><div class="leg-sq" style="background:#378ADD"></div>En progreso</div>
        <div class="leg-item"><div class="leg-sq" style="background:#888780"></div>Cerrados</div>
      </div>
      <div style="position:relative;height:180px"><canvas id="lineChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Distribución por estado</div>
      <div class="donut-wrap">
        <div style="position:relative;width:120px;height:120px"><canvas id="donutChart"></canvas></div>
        <div class="donut-labels" id="donut-labels"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <div class="card-title" style="margin-bottom:0">Tickets recientes</div>
      <button onclick="sendPrompt('Muéstrame cómo filtrar tickets por prioridad en React')" style="font-size:12px;padding:4px 12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer">Ver filtros ↗</button>
    </div>
    <div style="overflow-x:auto">
      <table id="tickets-table">
        <thead><tr>
          <th>#</th><th>Cliente</th><th>Asunto</th><th>Prioridad</th><th>Estado</th><th>Agente</th><th>Creado</th>
        </tr></thead>
        <tbody id="tickets-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const adminKpis=[{label:'Total tickets',val:248,sub:'este mes',dot:'#888780'},{label:'Abiertos',val:43,sub:'+5 hoy',dot:'#1D9E75'},{label:'En progreso',val:31,sub:'asignados',dot:'#378ADD'},{label:'Tiempo promedio',val:'2.4h',sub:'resolución',dot:'#EF9F27'}];
const agenteKpis=[{label:'Mis tickets',val:12,sub:'asignados',dot:'#378ADD'},{label:'Resueltos hoy',val:4,sub:'buen ritmo',dot:'#1D9E75'},{label:'Pendientes',val:8,sub:'sin respuesta',dot:'#EF9F27'},{label:'Satisfacción',val:'94%',sub:'últimas 30',dot:'#639922'}];

const tickets=[
  {id:'#1042',cliente:'Ana Torres',asunto:'No puedo iniciar sesión',prio:'Alta',estado:'open',agente:'CR',ag_color:'#1D9E75',fecha:'hace 10 min'},
  {id:'#1041',cliente:'Juan Mesa',asunto:'Error al generar factura',prio:'Alta',estado:'prog',agente:'LM',ag_color:'#378ADD',fecha:'hace 32 min'},
  {id:'#1040',cliente:'Sara López',asunto:'Cambio de plan de servicio',prio:'Media',estado:'prog',agente:'CR',ag_color:'#1D9E75',fecha:'hace 1h'},
  {id:'#1039',cliente:'Pedro Ríos',asunto:'Reembolso pendiente',prio:'Alta',estado:'urgent',agente:'—',ag_color:'#888',fecha:'hace 2h'},
  {id:'#1038',cliente:'Mónica Gil',asunto:'Consulta sobre términos',prio:'Baja',estado:'closed',agente:'LM',ag_color:'#378ADD',fecha:'hace 3h'},
  {id:'#1037',cliente:'Carlos Vera',asunto:'Actualizar datos de contacto',prio:'Baja',estado:'closed',agente:'CR',ag_color:'#1D9E75',fecha:'ayer'},
];

const estadoMap={open:{label:'Abierto',cls:'b-open'},prog:{label:'En progreso',cls:'b-prog'},closed:{label:'Cerrado',cls:'b-closed'},urgent:{label:'Urgente',cls:'b-urgent'}};
const prioColor={Alta:'#E24B4A',Media:'#EF9F27',Baja:'#888780'};

function renderKpis(data){
  const el=document.getElementById('kpis');
  el.innerHTML=data.map(k=>`<div class="kpi"><div class="kpi-label"><span class="kpi-dot" style="background:${k.dot}"></span>${k.label}</div><div class="kpi-val">${k.val}</div><div class="kpi-sub">${k.sub}</div></div>`).join('');
}

function renderTable(data){
  document.getElementById('tickets-body').innerHTML=data.map(t=>`
    <tr>
      <td style="font-family:monospace;font-size:12px;color:var(--color-text-secondary)">${t.id}</td>
      <td style="font-weight:500">${t.cliente}</td>
      <td style="color:var(--color-text-secondary);max-width:180px">${t.asunto}</td>
      <td><span class="prio"><span class="prio-dot" style="background:${prioColor[t.prio]}"></span>${t.prio}</span></td>
      <td><span class="badge ${estadoMap[t.estado].cls}">${estadoMap[t.estado].label}</span></td>
      <td><span class="agent-av" style="background:${t.ag_color}22;color:${t.ag_color}">${t.agente}</span></td>
      <td style="font-size:12px;color:var(--color-text-tertiary)">${t.fecha}</td>
    </tr>`).join('');
}

let lineChart,donutChart;
function initCharts(){
  if(lineChart)lineChart.destroy();
  if(donutChart)donutChart.destroy();
  lineChart=new Chart(document.getElementById('lineChart'),{
    type:'line',
    data:{
      labels:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],
      datasets:[
        {label:'Abiertos',data:[18,22,15,28,20,12,8],borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.08)',tension:0.4,pointRadius:3,borderWidth:2,fill:true},
        {label:'En progreso',data:[10,14,12,18,15,9,6],borderColor:'#378ADD',backgroundColor:'transparent',tension:0.4,pointRadius:3,borderWidth:2},
        {label:'Cerrados',data:[8,12,10,15,18,10,5],borderColor:'#888780',backgroundColor:'transparent',tension:0.4,pointRadius:3,borderWidth:2,borderDash:[4,3]}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:'#888'}},y:{grid:{color:'rgba(128,128,128,0.1)'},ticks:{font:{size:11},color:'#888'},beginAtZero:true}}}
  });
  const donutData=[{label:'Abiertos',val:43,color:'#1D9E75'},{label:'En progreso',val:31,color:'#378ADD'},{label:'Cerrados',val:174,color:'#B4B2A9'}];
  const total=donutData.reduce((a,b)=>a+b.val,0);
  donutChart=new Chart(document.getElementById('donutChart'),{
    type:'doughnut',
    data:{labels:donutData.map(d=>d.label),datasets:[{data:donutData.map(d=>d.val),backgroundColor:donutData.map(d=>d.color),borderWidth:0,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw} (${Math.round(c.raw/total*100)}%)`}}}}
  });
  document.getElementById('donut-labels').innerHTML=donutData.map(d=>`<div class="dl-row"><div class="leg-sq" style="background:${d.color}"></div>${d.label}<span class="dl-val">${d.val}</span></div>`).join('');
}

let currentView='admin';
function setView(v,btn){
  currentView=v;
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('greeting-name').textContent=v==='admin'?'Bienvenido, Admin':'Bienvenido, Carlos';
  renderKpis(v==='admin'?adminKpis:agenteKpis);
  const filtered=v==='agente'?tickets.filter(t=>t.agente==='CR'):tickets;
  renderTable(filtered);
}

renderKpis(adminKpis);
renderTable(tickets);
setTimeout(initCharts,100);
</script>
